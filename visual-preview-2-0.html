<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#050d1d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JARVIS" />
  <meta name="description" content="JARVIS — концепт голосового интерфейса без текста, с живой сферой." />
  
  
  
  <style>:root {
  color-scheme: dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  --ink: #d6efff;
  --cyan: #51d8ff;
  --muted: #789fbf;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #050d1d; overscroll-behavior: none; }
button { -webkit-tap-highlight-color: transparent; font: inherit; }
.app {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  color: var(--ink);
  background:
    radial-gradient(ellipse 55% 46% at 52% 51%, rgba(13, 51, 107, .52), transparent 79%),
    radial-gradient(ellipse 55% 55% at 23% 79%, rgba(7, 47, 99, .20), transparent 85%),
    linear-gradient(180deg, #051024 0%, #061329 39%, #050c1d 100%);
}
.ambient, .horizon, .grain { pointer-events: none; position: absolute; z-index: -1; }
.ambient { border-radius: 50%; filter: blur(65px); opacity: .45; mix-blend-mode: screen; }
.ambient-left { width: 65vw; height: 48vh; background: #082957; left: -32vw; top: 22vh; animation: drift-left 13s ease-in-out infinite alternate; }
.ambient-right { width: 64vw; height: 44vh; background: #0a356f; right: -35vw; bottom: -12vh; animation: drift-right 19s ease-in-out infinite alternate; }
.horizon { width: 160vw; height: 45vh; border-radius: 50%; opacity: .45; }
.horizon-one { bottom: -35vh; left: -24vw; transform: rotate(-18deg); border-top: 2px solid rgba(35, 180, 255, .27); box-shadow: 0 -14px 85px rgba(0, 92, 211, .30), 0 -4px 26px rgba(7, 201, 254, .14); }
.horizon-two { top: -40vh; right: -35vw; transform: rotate(-22deg); border-bottom: 1px solid rgba(23, 157, 238, .20); box-shadow: 0 22px 85px rgba(0, 116, 226, .16); }
.grain { inset: 0; opacity: .08; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.38'/%3E%3C/svg%3E"); }
.header { display: flex; align-items: center; flex-direction: column; gap: 10px; flex-shrink: 0; padding-top: max(calc(env(safe-area-inset-top) + 46px), 9.5vh); }
.symbol { display: flex; align-items: center; justify-content: center; gap: 5px; width: 45px; height: 35px; filter: drop-shadow(0 0 7px rgba(0, 185, 255, .65)); }
.symbol i { width: 3px; height: 11px; display: block; border-radius: 5px; background: linear-gradient(#91ebff 0%, #1bbaff 55%, #1580d7 100%); }
.symbol i:nth-child(2), .symbol i:nth-child(4) { height: 24px; }
.symbol i:nth-child(3) { height: 33px; }
.header h1 { margin: 9px 0 0; font-size: clamp(25px, 5vw, 34px); line-height: 1; font-weight: 250; letter-spacing: .41em; padding-left: .41em; color: #d9efff; text-shadow: 0 0 27px #47baff55; }
.header p { margin: 0; font-size: clamp(9px, 1.6vw, 11px); font-weight: 500; letter-spacing: .40em; padding-left: .40em; color: #46bdea; }
.experience { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0 10px 12px; }
.orb-composition { position: relative; flex: none; width: min(98vw, 560px, 57vh); aspect-ratio: 1; transform: translateZ(0); }
#orb-canvas { width: 100%; height: 100%; display: block; filter: saturate(1.07); }
.halo { position: absolute; inset: 10%; border-radius: 50%; pointer-events: none; mix-blend-mode: screen; }
.halo-a { background: radial-gradient(circle, transparent 52%, rgba(0, 144, 255, .06) 70%, transparent 100%); box-shadow: 0 0 86px 14px #0578d620; animation: halopulse 6s ease-in-out infinite; }
.halo-b { inset: 18%; background: radial-gradient(circle, transparent 60%, #8741ff13 80%, transparent 90%); filter: blur(17px); animation: halopulse 8s ease-in-out infinite reverse; }
.orb-control { position: absolute; left: 15.5%; top: 15.5%; width: 69%; height: 69%; background: transparent; border: none; border-radius: 50%; cursor: pointer; touch-action: manipulation; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
.orb-control:focus-visible { outline: 2px solid #87e7ff; outline-offset: 6px; }
.orb-control:active { transform: scale(.993); }
.equalizer { display: flex; justify-content: center; align-items: center; gap: 6px; width: 130px; height: 35px; margin-top: -9px; filter: drop-shadow(0 0 9px #009dff75); }
.equalizer span { display: block; height: 9px; width: 4px; border-radius: 4px; background: linear-gradient(to bottom, #92edff, #20c8ff 45%, #116ec7); opacity: .8; transform: scaleY(.6); animation: equalizer 1.8s ease-in-out infinite alternate paused; }
.equalizer span:nth-child(2), .equalizer span:nth-child(8) { height: 13px; animation-delay: -.3s; }
.equalizer span:nth-child(3), .equalizer span:nth-child(7) { height: 22px; animation-delay: -.8s; }
.equalizer span:nth-child(4), .equalizer span:nth-child(6) { height: 26px; animation-delay: -.15s; }
.equalizer span:nth-child(5) { height: 32px; animation-delay: -.6s; }
.app:not([data-state="idle"]) .equalizer span { animation-play-state: running; }
.app[data-state="speaking"] .equalizer span { animation-duration: .54s; }
.app[data-state="thinking"] .equalizer span { animation-duration: 1.3s; }
.state-copy { text-align: center; padding-top: 23px; min-height: 92px; }
.state-title { color: #e4f3ff; font-size: clamp(19px, 3.7vw, 23px); font-weight: 400; letter-spacing: .015em; text-shadow: 0 0 23px #65beff36; }
.state-detail { color: #78a2c0; font-size: clamp(12px, 2.6vw, 14px); letter-spacing: .02em; margin-top: 10px; }
.footer { flex: none; text-align: center; color: #5d7895; padding: 0 12px max(calc(env(safe-area-inset-bottom) + 27px), 36px); }
.footer p { font-size: 12px; margin: 0 0 15px; opacity: .76; }
.footer span { font-size: 9px; letter-spacing: .12em; line-height: 1.8; display: block; opacity: .62; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.app[data-state="listening"] .halo-a { box-shadow: 0 0 105px 23px #1199ee31; }
.app[data-state="speaking"] .halo-a { box-shadow: 0 0 135px 30px #10bcff44; }
.app[data-state="thinking"] .halo-b { filter: blur(20px) hue-rotate(15deg); }
@keyframes equalizer { 0% { transform: scaleY(.22); opacity: .55; } 100% { transform: scaleY(1); opacity: 1; } }
@keyframes halopulse { 0%,100% { transform: scale(.97); opacity: .6; } 50% { transform: scale(1.045); opacity: 1; } }
@keyframes drift-left { to { transform: translate(12vw, -8vh); } }
@keyframes drift-right { to { transform: translate(-9vw, 9vh); } }
@media (max-height: 720px) {
  .header { padding-top: max(calc(env(safe-area-inset-top) + 19px), 4vh); gap: 6px; }
  .header h1 { font-size: 25px; margin-top: 3px; }
  .header p { font-size: 9px; }
  .orb-composition { width: min(96vw, 510px, 53vh); }
  .state-copy { padding-top: 10px; min-height: 70px; }
  .footer { padding-bottom: max(calc(env(safe-area-inset-bottom) + 10px), 20px); }
  .footer p { margin-bottom: 9px; }
}
@media (max-width: 420px) and (min-height: 721px) { .orb-composition { width: min(100vw, 54vh); } }
@media (min-width: 820px) { .app { max-width: 100%; } .orb-composition { width: min(56vh, 560px); } .header { padding-top: 7vh; } .footer { padding-bottom: 35px; } }
@media (prefers-reduced-motion: reduce) {
  .ambient, .halo, .equalizer span { animation: none !important; }
}
</style>

    g.addColorStop(1, 'rgba(3,52,135,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(CX,CY,294,0,TAU); ctx.fill();

    for (let j=0; j<3; j++) {
      ctx.save();
      ctx.translate(CX,CY);
      ctx.rotate(.06 * Math.sin(t*.12+j*2));
      ctx.beginPath();
      ctx.ellipse(0, 0, 253+j*19, 235+j*21, -.12+j*.08, 0, TAU);
      ctx.strokeStyle = j===0 ? 'rgba(29,174,255,.23)' : 'rgba(43,131,218,.105)';
      ctx.lineWidth = j===0 ? .75 : .55;
      ctx.stroke();
      ctx.restore();
    }
    // Rotating arcs and orbiting light particles, no CSS fake looping.
    for (let j=0; j<4; j++) {
      const rate = (state === 'thinking' ? .65 : .16) * (j%2===0?1:-1);
      const start = t*rate + j*1.45;
      const radius = 250 + (j%3)*20;
      const len = .20 + .14 * Math.sin(t*.4+j)**2;
      const grad = ctx.createLinearGradient(CX-radius,CY,CX+radius,CY);
      grad.addColorStop(0,'rgba(45,154,255,0)');
      grad.addColorStop(.5,`rgba(71,207,255,${.45 + intensity*.15})`);
      grad.addColorStop(1,'rgba(154,85,255,0)');
      ctx.save();
      ctx.beginPath(); ctx.arc(CX,CY,radius,start,start+len);
      ctx.strokeStyle = grad; ctx.lineWidth = j===0 ? 1.65 : 1;
      ctx.shadowBlur = j===0 ? 13 : 6;
      ctx.shadowColor = '#07a8f9';ctx.stroke();ctx.restore();
      glowDot(CX+radius*Math.cos(start+len),CY+radius*Math.sin(start+len), j===0?1.6:.7, .37+intensity*.18);
    }
  }

  function orbMask() {
    ctx.beginPath(); ctx.arc(CX,CY,R,0,TAU);
  }
  function waveY(x,t,shift,amount) {
    const x0 = (x-CX)/75;
    const roll = state === 'thinking' ? 1.55 : state === 'speaking' ? 1.65 : .77;
    return 313 + shift + amount * (
      .57 * Math.sin(x0*1.18-t*roll+shift*.035)
       + .37 * Math.sin(x0*2.05 + t*.82 + shift*.1)
       + .20 * Math.sin(x0*.55 + t*.53)
    );
  }
  function drawRibbon(t, n, activity) {
    const offs = [-36,-18,-3,15,31];
    const shift = offs[n] + 6*Math.sin(t*.22+n);
    const amount = 27 + activity*37 + n*1.2;
    const thickness = 11 + activity*8 + (n===2?5:0);
    const grad = ctx.createLinearGradient(95,250,510,370);
    grad.addColorStop(0,'rgba(0,195,255,0)');
    grad.addColorStop(.15,'rgba(2,203,255,.19)');
    grad.addColorStop(.46,'rgba(20,195,250,.23)');
    grad.addColorStop(.70,'rgba(108,132,255,.24)');
    grad.addColorStop(.91,'rgba(173,73,245,.22)');
    grad.addColorStop(1,'rgba(186,83,255,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = grad;
    ctx.beginPath();
    for(let x=80; x<=520; x+=7) {
      const y=waveY(x,t,shift,amount)-thickness;
      if (x===80) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    for(let x=520; x>=80; x-=7) ctx.lineTo(x,waveY(x,t,shift,amount)+thickness);
    ctx.closePath();ctx.fill();

    // Highlight strand with an intense electric-blue to violet color blend.
    const stroke = ctx.createLinearGradient(108,280,492,335);
    stroke.addColorStop(0,'rgba(31,242,255,0)');
    stroke.addColorStop(.17,'rgba(31,234,255,.74)');
    stroke.addColorStop(.44,'rgba(114,245,255,.92)');
    stroke.addColorStop(.68,'rgba(112,151,255,.72)');
    stroke.addColorStop(.86,'rgba(212,131,255,.82)');
    stroke.addColorStop(1,'rgba(198,94,255,0)');
    ctx.beginPath();
    for(let x=80; x<=520; x+=6) {
      const y=waveY(x,t,shift,amount);
      if(x===80)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.lineWidth = n===2?2.15:1.0;
    ctx.strokeStyle=stroke;
    ctx.shadowColor = n<3?'#08dcff':'#b75cff';
    ctx.shadowBlur = n===2 ? 20 : 13;
    ctx.globalAlpha = n===2?.83:.34;
    ctx.stroke();ctx.restore();
  }
  function drawSphere(t,activity) {
    ctx.save();
    ctx.shadowColor = state === 'speaking' ? '#1cbdff' : '#0089ff';
    ctx.shadowBlur = 45 + activity*27;
    ctx.fillStyle = 'rgba(12,62,169,.90)';
    orbMask(); ctx.fill(); ctx.restore();

    ctx.save(); orbMask(); ctx.clip();
    const base = ctx.createRadialGradient(250,218,20, CX,CY,300);
    base.addColorStop(0,'#103d86');base.addColorStop(.32,'#071b49');
    base.addColorStop(.62,'#06173f');base.addColorStop(.89,'#080f30');base.addColorStop(1,'#101049');
    ctx.fillStyle = base;ctx.fillRect(90,90,420,420);
    if (image.complete && image.naturalWidth) {
      ctx.globalAlpha=.73;
      ctx.drawImage(image,CX-R,CY-R,2*R,2*R);
      ctx.globalAlpha=1;
    }
    // Volumetric light with a different frequency for each state.
    const light = ctx.createRadialGradient(210+25*Math.sin(t*.3),230,4,270,298,200);
    light.addColorStop(0,`rgba(21,130,249,${.12 + activity*.09})`);
    light.addColorStop(.5,'rgba(26,82,188,.05)');light.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=light;ctx.fillRect(90,90,420,420);
    const purple = ctx.createRadialGradient(451,405,6,390,391,180);
    purple.addColorStop(0,`rgba(183,40,237,${.19+activity*.12})`);
    purple.addColorStop(.67,'rgba(70,26,186,.045)');purple.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=purple;ctx.fillRect(90,90,420,420);

    // Faint volumetric filaments, never static orbit illusion.
    for(let i=0; i<5; i++) drawRibbon(t+i*.05,i,activity);
    for (const s of stars) {
      const twinkle = Math.max(0, Math.sin(t*(.65+s.size*.2)+s.phase));
      glowDot(s.x+2*Math.sin(t*.22+s.phase),s.y,s.size, (.08+twinkle*.20)*(1+activity*.50));
    }
    // Shadows near the bottom and transparent glass highlight at top.
    let shade = ctx.createLinearGradient(300,110,300,490);
    shade.addColorStop(0,'rgba(5,11,30,.03)');shade.addColorStop(.43,'rgba(0,0,0,0)');shade.addColorStop(1,'rgba(2,8,30,.17)');
    ctx.fillStyle=shade;ctx.fillRect(95,95,410,410);
    ctx.restore();

    const rim = ctx.createLinearGradient(112,130,484,460);
    rim.addColorStop(0,'rgba(18,130,255,.25)');
    rim.addColorStop(.2,'rgba(72,214,255,.96)');
    rim.addColorStop(.4,'rgba(96,235,255,.96)');
    rim.addColorStop(.66,'rgba(60,164,255,.70)');
    rim.addColorStop(.86,'rgba(168,118,255,.94)');
    rim.addColorStop(1,'rgba(34,147,255,.42)');
    ctx.save();ctx.shadowBlur=18+activity*9;ctx.shadowColor='#13b5ff';
    orbMask();ctx.strokeStyle=rim;ctx.lineWidth=2.1;ctx.stroke();ctx.restore();
    ctx.save();
    ctx.strokeStyle = 'rgba(190,241,255,.17)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(CX,CY,R-6,Math.PI*1.22,Math.PI*1.88);ctx.stroke();ctx.restore();
    const aura = ctx.createRadialGradient(CX,CY,197,CX,CY,260);
    aura.addColorStop(0,`rgba(9,133,240,${.12+activity*.06})`);
    aura.addColorStop(1,'rgba(0,80,140,0)');
    ctx.fillStyle=aura;orbMask();ctx.fill();
  }
  function render(timestamp) {
    raf = requestAnimationFrame(render);
    const frameInterval = reducedMotion ? 150 : (window.innerWidth < 600 ? 1000/45 : 1000/55);
    if (timestamp - lastRenderAt < frameInterval) return;
    lastRenderAt=timestamp;
    const t = reducedMotion ? 1 : timestamp/1000;
    const mic = micEnvelope(timestamp);
    const response = state==='speaking' ? .44+.32*Math.sin(t*5.3)**2+.17*Math.sin(t*10.8)**2 : 0;
    const thinking=state==='thinking'?.4+.14*Math.sin(t*2)**2:0;
    const target = Math.min(1, Math.max(mic,response,thinking));
    smoothLevel += (target - smoothLevel)*(target>smoothLevel?.28:.08);
    peak += ((state==='idle'?.08:.14) + smoothLevel*.8 - peak)*.08;
    ctx.clearRect(0,0,CW,CW);
    drawBackdrop(t,smoothLevel);
    drawSphere(t,Math.max(peak,smoothLevel));
    lastUpdateMs=timestamp;
  }
  raf=requestAnimationFrame(render);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (raf) cancelAnimationFrame(raf);
      raf=0;
      // The visual demo should not keep a microphone active when not visible.
      endSession();
    } else if (!raf) raf=requestAnimationFrame(render);
  });
  if (false && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
})();
</script>
</body>
